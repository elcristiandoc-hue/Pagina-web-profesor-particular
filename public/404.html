<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página no encontrada · Cristian Ortega</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 500 700;
        font-display: swap;
        src: url('/fonts/fraunces-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/nunito-sans-latin.woff2') format('woff2');
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f7f3ec;
        color: #1b2233;
        font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
        font-size: 17px;
        line-height: 1.55;
        text-align: center;
      }
      main {
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
      }
      h1 {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(28px, 6vw, 40px);
        font-weight: 600;
        line-height: 1.15;
      }
      p {
        margin: 0;
        color: #565d6d;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 24px;
        border-radius: 8px;
        background: #a34a25;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        background: #7e3719;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Esta página no existe.</h1>
      <p>Puede que el enlace esté mal escrito o que la página ya no esté disponible.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
